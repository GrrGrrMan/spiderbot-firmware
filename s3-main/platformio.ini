[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_opi

# Enable PSRAM (ESP32-S3-DevKitC-1 typically has 8MB Octal PSRAM)
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

# Use deep+ so PlatformIO recursively passes SPI and Wire include paths to all sub-libraries
lib_ldf_mode = deep+

# Recursively append 'include' and all child folders (e.g. include/config) to the include path
extra_scripts =
    pre:../extra_scripts/add_includes.py

lib_deps =
    SPI
    Wire
    adafruit/Adafruit PWM Servo Driver Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson