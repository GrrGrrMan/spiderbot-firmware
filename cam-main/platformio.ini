[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv

# P2 camera: enables CAM_ENABLE_MJPEG (cam-main only; s3-main leaves it undefined)
# P6b cutover: CAM_ENABLE_SERVO defaults ON (servo-capable build). To roll CAM
# over to camera-only mode, append `-UCAM_ENABLE_SERVO` (PlatformIO undefine) to
# build_flags, or use `pio run -DCAM_ENABLE_SERVO=0`. When undefined:
#   - TaskControl (servo loop + watchdog) is not created
#   - servo/motion/pose command handlers are not registered
#   - telemetry.power field is omitted (servo state uninitialized)
build_flags =
    -DCAM_ENABLE_MJPEG
    -DCAM_ENABLE_SERVO

# Use deep+ so PlatformIO recursively passes SPI and Wire include paths to all sub-libraries
lib_ldf_mode = deep+

extra_scripts = 
    pre:../extra_scripts/add_includes.py
    pre:../extra_scripts/push_firmware.py

lib_deps = 
    SPI
    Wire
    adafruit/Adafruit PWM Servo Driver Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    espressif/esp32-camera