[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv

# P2 camera: enables CAM_ENABLE_MJPEG (cam-main only; s3-main leaves it undefined)
build_flags = 
    -DCAM_ENABLE_MJPEG

# Use deep+ so PlatformIO recursively passes SPI and Wire include paths to all sub-libraries
lib_ldf_mode = deep+

extra_scripts = 
    pre:../extra_scripts/add_includes.py
    pre:../extra_scripts/push_firmware.py

lib_deps = 
    SPI
    Wire
    adafruit/Adafruit PWM Servo Driver Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    espressif/esp32-camera