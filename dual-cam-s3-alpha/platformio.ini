[platformio]

default_envs = esp32cam

; default_envs =
;     esp32s3_ipex
;     esp32cam
; default_envs = esp32cam
; default_envs = esp32s3_ipex
; default_envs =


[common]
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    chrisjoyce911/esp32FOTA
    knolleary/PubSubClient

; Shared upload/build behavior.
; custom_auto_push_firmware controls whether a successful build publishes the
; selected environment's OTA artifact to the configured remote branch.
[env]
platform = espressif32@6.13.0
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
extra_scripts = extra_scripts = pre:../extra_scripts/push_firmware.py
custom_auto_push_firmware = yes
custom_auto_push_remote = origin
custom_auto_push_branch = main
custom_auto_push_commit_prefix = OTA
custom_ota_trigger_mqtt = no
custom_ota_trigger_host = broker.hivemq.com
custom_ota_trigger_port = 1883
custom_ota_trigger_payload = 1
custom_ota_trigger_retain = yes
lib_deps = ${common.lib_deps}

; Existing ESP32-CAM workflow. Publishes bin/firmware-esp32cam.bin to main.
; Keep servo enabled for the legacy APK/friend-house CAM controls.
[env:esp32cam]
board = esp32cam
custom_firmware_artifact = bin/firmware-esp32cam
custom_auto_push_branch = main
custom_ota_trigger_topic = beanspiderbot/ota/TG398Z
build_flags =
    -D ALPHA_TARGET_ESP32CAM
    -D ALPHA_TARGET_CONFIG_HEADER=\"Build/esp_cam.h\"
    ; -D FEATURE_LED ; Irrelevant and UNSAFE compared to multi
    -D FEATURE_MQTT
    -D FEATURE_MOTOR_V3   
    -D FEATURE_SERVO
    ; -D FEATURE_RGB
    -D FEATURE_OTA_PULL
    ; -D FEATURE_GPIO_LEDS
    ; Unneeded
    ; -D FEATURE_ULTRASOUND
    ; Disabled by default: CFG_ULTRASOUND_TRIG_PIN shares GPIO14 with servo I2C SDA.

; ESP32-S3 IPEX workflow. Publishes bin/firmware-esp32s3.bin to main.
; Comment feature lines here to toggle board capabilities for this target.
[env:esp32s3_ipex]
board = esp32-s3-ipex-n16r8
board_build.partitions = default_16MB.csv
custom_firmware_artifact = bin/firmware-esp32s3
custom_auto_push_branch = main
custom_ota_trigger_topic = alphaesp32s3/spiderbot-s3/ota
build_flags =
    -D ALPHA_TARGET_ESP32S3_IPEX
    -D ALPHA_TARGET_CONFIG_HEADER=\"Build/esp_s3.h\"
    ; Keep Arduino Serial on UART0 for the board's CH343 USB-serial bridge.
    ; Enable ARDUINO_USB_CDC_ON_BOOT only when using the native ESP32-S3 USB port.
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FEATURE_MQTT
    -D FEATURE_OTA_PULL
    ; V2 owns the S3 movement command layer. FEATURE_SERVO remains enabled as
    ; the low-level PCA9685 driver used by Motor/V2 and existing light helpers.
    ; -D FEATURE_MOTOR_V2
    -D FEATURE_MOTOR_V3   
    -D FEATURE_SERVO
    ; Disable the bright soldered-on WS2812/RGB at boot.
    -D FEATURE_ONBOARD_RGB_OFF
    ; -D FEATURE_LED
    ; -D FEATURE_RGB
    ; -D FEATURE_GPIO_LEDS
    ; -D FEATURE_LIGHTS
    ; -D FEATURE_ULTRASOUND
